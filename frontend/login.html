<!DOCTYPE html>
<html lang="id">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <!-- Import Font Gayathri -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Gayathri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="global.css">

    </head>

    <body>

    <main class="login-container">
        <h1 class="title">Login</h1>
        
        <form style="width: 100%; display: flex; flex-direction: column; align-items: center;">
        <div class="form-group">
            <input type="text" class="form-input" placeholder="Username" required />
        </div>

        <div class="form-group">
            <input type="password" class="form-input" placeholder="Password" required />
        </div>

        <a href="admin.html" class="btn-submit">Login</a>
        </form>
    </main>

    <a href="index.html" class="back-button">
        <div class="back-icon"></div>
        <span class="back-text">Kembali</span>
    </a>
    
    <div class="batik-rummi-bg"></div>

    </body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>
  
  <!-- Font Gayathri -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gayathri:wght@400;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="/asset/style/login.css">
  <link rel="stylesheet" href="/asset/style/global.css">
</head>
<body>
    <div class="batik-rummi-bg"></div>

  <!-- Bagian Utama Login (Menggunakan Tag Semantik <main> dan <section>) -->
  <main class="login-wrapper">
    <section class="login-card">
      <h1 class="title">Login</h1>

    <form class="login-form">
    <div class="form-group">
        <input type="text" id="username" class="form-input" placeholder="Username" required />
    </div>

    <div class="form-group">
        <input type="password" id="password" class="form-input" placeholder="Password" required />
    </div>

    <!-- Diubah menjadi tag <a> -->
    <a href="/frontend/admin.html" class="btn-submit">Login</a>
    </form>
    </section>

    <!-- Tombol Kembali -->
    <a href="/frontend/index.html" class="back-button">
      <div class="back-icon"></div>
      <span class="back-text">Kembali</span>
    </a>
  </main>

  <!-- Dekorasi Batik (Pojok Kanan Bawah) -->
  <img class="batik-bg" src="/asset/images/supergrafis rummi burung.png" alt="Dekorasi Batik" />

  <!-- Footer Bar Maroon -->
  <footer class="footer-bar"></footer>

</body>
</html>
